<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typisch Türkisch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15161c;
    --surface:#1e2029;
    --surface-2:#262933;
    --line:#333745;
    --text:#f2f1ee;
    --muted:#9ba0b0;
    --red:#e03a46;
    --red-dark:#b22a35;
    --nazar:#2f9ad6;
    --nazar-dark:#1f76a8;
    --gold:#e8b84b;
    --green:#4caf72;
    --green-dark:#3a8d59;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-weight:600;
    overscroll-behavior:none;
  }
  #app{
    max-width:460px;margin:0 auto;min-height:100%;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font-family:inherit;font-weight:800;cursor:pointer;border:0;color:inherit}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 18px 10px}
  .stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
  .stat .ic{font-size:18px;line-height:1}
  .stat.fire{color:var(--gold)}
  .stat.gem{color:var(--nazar)}
  .stat.heart{color:var(--red)}
  .topbar .spacer{flex:1}

  /* ---------- home ---------- */
  .hero{padding:4px 18px 18px}
  .hero h1{
    margin:0;font-size:25px;font-weight:900;letter-spacing:-.4px;
  }
  .hero h1 .tr{color:var(--red)}
  .hero p{margin:5px 0 0;color:var(--muted);font-size:14px;font-weight:600;line-height:1.45}

  .daily{
    margin:0 18px 18px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:14px 16px;
  }
  .daily-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .daily-row b{font-size:14px;font-weight:800}
  .daily-row span{font-size:13px;color:var(--muted);font-weight:700}
  .bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#f3d383);transition:width .5s cubic-bezier(.2,.8,.2,1)}

  .path{padding:0 18px 40px;display:flex;flex-direction:column;gap:0}
  .unit{margin-bottom:10px}
  .unit-head{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line);
    border-left:4px solid var(--red);
    border-radius:12px;padding:12px 14px;margin:16px 0 4px;
  }
  .unit-head .uh{flex:1;min-width:0}
  .unit-head .chev{
    margin-left:auto;flex:none;color:var(--muted);font-size:13px;
    width:26px;height:26px;border-radius:8px;background:var(--surface-2);
    display:grid;place-items:center;transition:transform .15s ease;
  }
  .unit-head .chev.up{transform:rotate(180deg)}
  .unit-head .n{
    width:26px;height:26px;border-radius:8px;background:var(--red);
    display:grid;place-items:center;font-size:13px;font-weight:900;flex:none;
  }
  .unit-head .t{font-size:15px;font-weight:900;line-height:1.2}
  .unit-head .s{font-size:12px;color:var(--muted);font-weight:700;margin-top:1px}

  .node{display:flex;align-items:center;gap:14px;padding:9px 2px;text-align:left;width:100%;background:none}
  .orb{
    width:58px;height:58px;border-radius:50%;flex:none;position:relative;
    display:grid;place-items:center;font-size:24px;
    background:var(--surface-2);border:2px solid var(--line);
    transition:transform .12s ease;
  }
  .node:active .orb{transform:scale(.93)}
  .orb.done{background:var(--green);border-color:var(--green-dark);box-shadow:0 4px 0 var(--green-dark)}
  .orb.open{background:var(--red);border-color:var(--red-dark);box-shadow:0 4px 0 var(--red-dark)}
  .orb.gold{background:var(--gold);border-color:#b8902f;color:#2a2109;box-shadow:0 4px 0 #b8902f}
  .orb.lock{opacity:.42}
  .orb .crown{
    position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:#2a2109;font-size:10px;font-weight:900;
    padding:1px 7px;border-radius:99px;border:2px solid var(--bg);
  }
  .node .meta{flex:1;min-width:0}
  .node .meta b{display:block;font-size:15px;font-weight:800}
  .node .meta span{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:2px}

  /* ---------- lesson ---------- */
  .lessbar{display:flex;align-items:center;gap:12px;padding:14px 18px 6px}
  .x{background:none;font-size:24px;color:var(--muted);line-height:1;padding:0 2px;font-weight:700}
  .lessbar .bar{flex:1}
  .lessbar .bar>i{background:linear-gradient(90deg,var(--green),#7ed39b)}

  .q{flex:1;display:flex;flex-direction:column;padding:18px 18px 0}
  .q-kind{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:8px}
  .q-text{font-size:21px;font-weight:800;line-height:1.35;margin:0 0 4px}
  .q-sub{font-size:14px;color:var(--muted);font-weight:700;margin:6px 0 0;line-height:1.45}

  .speak{
    margin-top:16px;display:flex;align-items:center;gap:12px;
    background:var(--surface);border:2px solid var(--line);border-radius:14px;
    padding:16px;width:100%;text-align:left;font-size:17px;font-weight:800;
  }
  .speak .sp{
    width:42px;height:42px;border-radius:12px;background:var(--nazar);flex:none;
    display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 var(--nazar-dark)
  }

  .opts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .opt{
    background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;
    border-radius:14px;padding:15px 16px;font-size:16.5px;text-align:left;width:100%;
    transition:background .1s,border-color .1s;
  }
  .opt:active{background:var(--surface-2)}
  .opt.sel{background:rgba(47,154,214,.14);border-color:var(--nazar)}
  .opt.ok{background:rgba(76,175,114,.16);border-color:var(--green)}
  .opt.no{background:rgba(224,58,70,.14);border-color:var(--red)}
  .opt small{display:block;color:var(--muted);font-size:12.5px;font-weight:700;margin-top:3px}

  /* build */
  .answerbox{
    margin-top:20px;min-height:62px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);
    padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
  }
  .bank{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
  .tile{
    background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;
    border-radius:11px;padding:10px 14px;font-size:16px;
  }
  .tile.used{opacity:.22;pointer-events:none}
  .tile.inans{background:var(--surface-2)}

  /* match */
  .matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  .mcell{
    background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;
    border-radius:12px;padding:14px 10px;font-size:15px;text-align:center;min-height:56px;
  }
  .mcell.sel{background:rgba(47,154,214,.16);border-color:var(--nazar)}
  .mcell.gone{opacity:.2;pointer-events:none;border-color:var(--green)}

  /* culture card */
  .card{
    margin-top:14px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:18px;
  }
  .card .big{font-size:26px;font-weight:900;color:var(--gold);margin:0 0 4px}
  .card .lit{font-size:13.5px;color:var(--muted);font-weight:700;margin:0 0 12px}
  .card p{margin:0;font-size:15px;font-weight:600;line-height:1.6}
  .card .tip{
    margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
    font-size:14px;color:var(--muted);font-weight:700;line-height:1.55;
  }

  /* footer / feedback */
  .foot{padding:16px 18px calc(30px + env(safe-area-inset-bottom));border-top:1px solid transparent}
  .foot.ok{background:rgba(76,175,114,.1);border-top-color:rgba(76,175,114,.3)}
  .foot.no{background:rgba(224,58,70,.09);border-top-color:rgba(224,58,70,.3)}
  .fb{display:flex;align-items:flex-start;gap:10px;margin-bottom:13px}
  .fb .mark{font-size:20px;line-height:1.25;flex:none}
  .fb b{display:block;font-size:16px;font-weight:900;margin-bottom:2px}
  .fb span{font-size:14px;font-weight:700;line-height:1.5;color:var(--text);opacity:.92}
  .fb.ok b{color:var(--green)}
  .fb.no b{color:var(--red)}
  .cta{
    width:100%;padding:16px;border-radius:14px;font-size:16px;letter-spacing:.3px;
    background:var(--green);box-shadow:0 4px 0 var(--green-dark);text-transform:uppercase;
  }
  .cta:disabled{background:var(--surface-2);box-shadow:0 4px 0 #1b1d25;color:#5f6578;cursor:default}
  .cta.red{background:var(--red);box-shadow:0 4px 0 var(--red-dark)}
  .cta:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--green-dark)}
  .cta.ghost{background:none;box-shadow:none;color:var(--muted);text-transform:none;font-weight:800;padding:12px}

  /* result */
  .result{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px 24px;text-align:center}
  .result .emo{font-size:58px;margin-bottom:10px}
  .result h2{margin:0 0 6px;font-size:25px;font-weight:900}
  .result p{margin:0;color:var(--muted);font-size:15px;font-weight:700;line-height:1.5}
  .scores{display:flex;gap:12px;margin:26px 0 8px;width:100%}
  .score{flex:1;border-radius:14px;padding:2px;background:var(--gold)}
  .score.b{background:var(--nazar)}
  .score .in{background:var(--surface);border-radius:12px;padding:11px 8px}
  .score .k{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:800}
  .score .v{font-size:21px;font-weight:900;margin-top:2px}

  /* ---------- Bonus / Merkliste ---------- */
  .bcard{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:20px;margin-top:16px;
  }
  .btag{
    display:inline-block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
    font-weight:900;color:var(--gold);border:1px solid rgba(232,184,75,.4);
    border-radius:99px;padding:3px 10px;margin-bottom:12px;
  }
  .bcard .tr{font-size:20px;font-weight:900;line-height:1.35;margin:0 0 8px}
  .bcard .li{font-size:13.5px;color:var(--muted);font-weight:700;font-style:italic;margin:0 0 14px;line-height:1.45}
  .bcard .me{font-size:15.5px;font-weight:700;margin:0;line-height:1.55}
  .bcard .us{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);
    font-size:13.5px;color:var(--muted);font-weight:700;line-height:1.5}
  .savebtn{
    margin-top:16px;width:100%;background:var(--surface-2);border:2px solid var(--line);
    border-radius:12px;padding:12px;font-size:14.5px;font-weight:800;color:var(--muted);
  }
  .savebtn.on{background:rgba(232,184,75,.14);border-color:var(--gold);color:var(--gold)}
  .counter{font-size:13px;color:var(--muted);font-weight:800;text-align:center;margin-top:14px}

  .listitem{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:14px 15px;margin-bottom:10px;
  }
  .listitem .tr{font-size:16px;font-weight:900;margin:0 0 4px;line-height:1.35}
  .listitem .me{font-size:14px;font-weight:700;color:var(--muted);margin:0;line-height:1.45}
  .listitem button{background:none;color:var(--red);font-size:13px;font-weight:800;padding:8px 0 0}
  .empty{text-align:center;color:var(--muted);font-size:14.5px;font-weight:700;line-height:1.6;padding:40px 10px}

  /* ---------- Hörecke ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 18px 14px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chips button{
    flex:none;background:var(--surface);border:2px solid var(--line);border-radius:99px;
    padding:8px 14px;font-size:13.5px;font-weight:800;color:var(--muted);white-space:nowrap;
  }
  .chips button.on{background:rgba(47,154,214,.16);border-color:var(--nazar);color:var(--text)}
  .player{padding:0 18px}
  .pcard{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:22px 20px;min-height:260px;display:flex;flex-direction:column;
  }
  .pcard .ptr{font-size:22px;font-weight:900;line-height:1.35;margin:0 0 10px}
  .pcard .pli{font-size:13.5px;color:var(--muted);font-weight:700;font-style:italic;margin:0 0 16px;line-height:1.45}
  .pcard .pde{font-size:16px;font-weight:700;margin:0;line-height:1.55}
  .pcard .pus{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
    font-size:13.5px;color:var(--muted);font-weight:700;line-height:1.5}
  .pcard .now{margin-top:auto;padding-top:14px;font-size:11.5px;letter-spacing:1.1px;
    text-transform:uppercase;font-weight:800;color:var(--nazar)}
  .controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:20px}
  .controls button{
    width:54px;height:54px;border-radius:50%;background:var(--surface-2);
    border:2px solid var(--line);font-size:20px;display:grid;place-items:center;
  }
  .controls .big{
    width:74px;height:74px;background:var(--red);border-color:var(--red-dark);
    box-shadow:0 4px 0 var(--red-dark);font-size:26px;
  }
  .controls button:disabled{opacity:.35}
  .warn{
    margin:0 18px 14px;background:rgba(232,184,75,.1);border:1px solid rgba(232,184,75,.35);
    border-radius:12px;padding:12px 14px;font-size:13px;font-weight:700;color:var(--gold);line-height:1.5;
  }

  /* ---------- Kulturecke / Lesen ---------- */
  .themerow{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:14px 15px;margin-bottom:10px;
  }
  .themerow .ti{
    width:44px;height:44px;border-radius:12px;background:var(--surface-2);
    display:grid;place-items:center;font-size:21px;flex:none;
  }
  .themerow b{display:block;font-size:15.5px;font-weight:900}
  .themerow small{display:block;color:var(--muted);font-size:12.5px;font-weight:700;margin-top:2px}
  .themerow .mk{margin-left:auto;color:var(--gold);font-size:15px;flex:none}

  .ambbar{display:flex;gap:8px;padding:0 18px 14px;align-items:center}
  .ambbar button{
    flex:1;background:var(--surface);border:2px solid var(--line);border-radius:12px;
    padding:10px 6px;font-size:13px;font-weight:800;color:var(--muted);
  }
  .ambbar button.on{background:rgba(47,154,214,.15);border-color:var(--nazar);color:var(--text)}

  .read{padding:0 20px 40px}
  .sec{padding:22px 0;border-bottom:1px solid var(--line)}
  .sec:last-child{border-bottom:0}
  .sec.marked{background:rgba(232,184,75,.05);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:12px}
  .sec h3{margin:0 0 3px;font-size:18.5px;font-weight:900;line-height:1.3}
  .sec .tw{font-size:14px;color:var(--gold);font-weight:800;margin:0 0 12px}
  .sec p{margin:0;font-size:16px;font-weight:600;line-height:1.75;color:#e6e5e1}
  .sec .tp{margin-top:13px;font-size:14.5px;color:var(--muted);font-weight:700;line-height:1.6;
    border-left:3px solid var(--line);padding-left:12px}
  .sec .mkbtn{margin-top:14px;background:none;color:var(--muted);font-size:13px;font-weight:800;padding:6px 0}
  .sec .mkbtn.on{color:var(--gold)}

  .homebtns{display:flex;gap:10px;padding:0 18px 4px}
  .homebtns button{
    flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;
    padding:11px 8px;font-size:13.5px;font-weight:800;color:var(--text);
  }

  /* ---------- Anmeldung / Profile ---------- */
  .auth{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 22px}
  .auth .brand{font-size:30px;font-weight:900;letter-spacing:-.6px;margin:0 0 4px}
  .auth .brand .tr{color:var(--red)}
  .auth .lead{color:var(--muted);font-size:14.5px;font-weight:600;line-height:1.5;margin:0 0 26px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:6px}
  .field input{
    width:100%;background:var(--surface);border:2px solid var(--line);border-radius:13px;
    padding:14px 15px;font-size:16px;font-family:inherit;font-weight:700;color:var(--text);
  }
  .field input:focus{outline:none;border-color:var(--nazar)}
  .err{color:var(--red);font-size:13.5px;font-weight:700;margin:2px 0 10px;min-height:18px}
  .auth .cta{margin-top:6px}
  .switchline{text-align:center;margin-top:18px;font-size:14px;color:var(--muted);font-weight:700}
  .switchline button{background:none;color:var(--nazar);font-size:14px;font-weight:800;padding:4px}
  .known{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
  .known button{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;
    border-radius:13px;padding:12px 14px;font-size:15.5px;
  }
  .ava{
    width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:var(--nazar);color:#fff;font-size:16px;font-weight:900;
  }
  .ava.sm{width:30px;height:30px;font-size:13px}
  .known button small{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-top:1px}

  .chip{display:flex;align-items:center;gap:7px;background:none;padding:0;font-size:14px;font-weight:800}
  .sheet{
    position:fixed;inset:0;background:rgba(10,11,15,.72);
    display:flex;align-items:flex-end;justify-content:center;z-index:40;
  }
  .sheet .inner{
    width:100%;max-width:460px;background:var(--surface);
    border-top-left-radius:22px;border-top-right-radius:22px;
    padding:20px 20px calc(22px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .sheet h3{margin:0 0 3px;font-size:18px;font-weight:900}
  .sheet .who{color:var(--muted);font-size:13.5px;font-weight:700;margin:0 0 16px}
  .sheet .row{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--surface-2);border-radius:13px;padding:13px 14px;font-size:15px;margin-bottom:9px;
  }
  .note{
    margin-top:14px;font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.5;
    border-top:1px solid var(--line);padding-top:13px;
  }

  .hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   TYPISCH TÜRKISCH
   Türkisch und türkisches Leben für Deutschsprachige.
   ========================================================= */
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- 1. INHALT ---------- */
const UNITS = [
  {
    t:"Die ersten Worte", s:"Begrüßen, danken, verabschieden", icon:"👋",
    lessons:[
      { t:"Hallo und Tschüss", s:"7 Übungen", items:[
        {k:"choice", de:"Hallo", tr:"Merhaba", opts:["Merhaba","Teşekkürler","Günaydın","Hoş geldin"]},
        {k:"choice", de:"Guten Morgen", tr:"Günaydın", opts:["İyi geceler","Günaydın","Nasılsın","Görüşürüz"]},

const LESSON_TARGET = 30;
function genLessons(){
  UNITS.forEach((u,ui)=>{
    const pool = POOL[ui]; if(!pool || pool.length < 6) return;
    const other = (w, key) => shuffle(pool.filter(x=>x[key] !== w[key])).slice(0,3).map(x=>x[key]);
    const opts = (w, key) => shuffle([w[key], ...other(w, key)]);
    let n = 0;
    while(u.lessons.length < LESSON_TARGET && n + 3 <= pool.length){
      const neu = pool.slice(n, n+3);
      const seen = pool.slice(0, n);
      const rev = [];
      for(let i=0; i<3 && seen.length; i++) rev.push(seen[(n*7 + i*17) % seen.length]);

      const pairs = [], usedTr = {}, usedDe = {};
      [...neu, ...rev, ...pool].forEach(w=>{
        if(pairs.length >= 4 || usedTr[w.tr] || usedDe[w.de]) return;
        usedTr[w.tr] = usedDe[w.de] = 1;
        pairs.push([w.tr, w.de]);
      });

      const items = [
        {k:"choice", de:neu[0].de, tr:neu[0].tr, opts:opts(neu[0],"tr")},
        {k:"choice", de:neu[1].de, tr:neu[1].tr, opts:opts(neu[1],"tr")},
        {k:"listen", tr:neu[2].tr, de:neu[2].de, opts:opts(neu[2],"de")},
        {k:"match", pairs},
        {k:"choice", lbl:"Was heißt das auf Deutsch", de:neu[0].tr, tr:neu[0].de, opts:opts(neu[0],"de")}
      ];
      const r = rev[0] || neu[1];
      items.push({k:"choice", de:r.de, tr:r.tr, opts:opts(r,"tr")});

      u.lessons.push({ t: neu.map(w=>w.tr).join(", "), s:"6 Übungen", items });
      n += 3;
    }
  });
}

let ttsOk = true, trVoice = null, deVoice = null;
function pickVoices(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    if(!vs.length) return;
    const tr = vs.filter(v=>/^tr/i.test(v.lang));
    const deAll = vs.filter(v=>/^de/i.test(v.lang));
    const fem = /(yelda|filiz|seda|zeynep|ayla|meltem|female|woman|kad[ıi]n)/i;
    const femDe = /(anna|petra|marlene|katja|helena|female|woman)/i;
    trVoice = tr.find(v=>fem.test(v.name)) || tr[0] || null;
    deVoice = deAll.find(v=>femDe.test(v.name)) || deAll[0] || null;
    ttsOk = !!tr.length;
  }catch(e){ ttsOk = false; }
}
try{
  if(window.speechSynthesis){ pickVoices(); speechSynthesis.onvoiceschanged = pickVoices; }
  else ttsOk = false;
}catch(e){ ttsOk = false; }

function speak(text, lang, cb){
  try{
    if(!window.speechSynthesis){ cb && cb(); return; }
    /* Türkisch niemals mit einer deutschen Stimme vorlesen:
       das würde eine falsche Aussprache antrainieren. */
    if(lang !== "de" && !trVoice){ cb && cb(); return; }
    const u = new SpeechSynthesisUtterance(text);
    if(lang === "de"){ u.lang = "de-DE"; if(deVoice) u.voice = deVoice; u.rate = .95; }
    else { u.lang = "tr-TR"; if(trVoice) u.voice = trVoice; u.rate = .82; }
    u.onend = () => cb && cb();
    u.onerror = () => cb && cb();
    speechSynthesis.speak(u);
  }catch(e){ cb && cb(); }
}
function say(text, lang, cb){
  try{ speechSynthesis.cancel(); }catch(e){}
  speak(text, lang || "tr", cb);
}

   Sobald hier eine Aufnahme liegt, wird sie statt der
   Gerätestimme abgespielt. Fehlt sie, greift die
   Gerätestimme, und fehlt die auch, sagt die App es.      */
const AUDIO = {};
let curAudio = null;
function stopClip(){

}
function playClip(key, text, lang, cb){

      curAudio.onerror = () => speak(text, lang, cb);

      if(pr && pr.catch) pr.catch(()=>speak(text, lang, cb));
      return;
    }catch(e){}

}

/* ---------- Töne ----------
   Alles wird im Browser erzeugt, keine Audiodateien.    */
let AC = null;
function ac(){
  try{
    if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
    if(AC.state === "suspended") AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(freq, start, dur, vol, type){
  const c = ac(); if(!c) return;
  try{
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    const t0 = c.currentTime + start;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }catch(e){}
}
/* ---------- Naturklang im Hintergrund ----------
   Wird im Browser erzeugt, keine Audiodatei, läuft endlos. */
let AMB = null;
function ambStop(){
  try{ if(AMB){ AMB.src.stop(); if(AMB.lfo) AMB.lfo.stop(); } }catch(e){}
  AMB = null;
}
function ambStart(kind){
  const c = ac(); if(!c) return false;
  ambStop();
  try{
    const n = 3 * c.sampleRate;
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for(let i=0;i<n;i++){
      const w = Math.random()*2 - 1;
      last = (last + 0.02*w) / 1.02;
      d[i] = last * 3.2;
    }
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const flt = c.createBiquadFilter();
    const g = c.createGain();
    let lfo = null;
    if(kind === "yagmur"){ flt.type = "bandpass"; flt.frequency.value = 1500; flt.Q.value = 0.35; g.gain.value = 0.17; }
    else if(kind === "deniz"){ flt.type = "lowpass"; flt.frequency.value = 520; g.gain.value = 0.20; }
    else { flt.type = "lowpass"; flt.frequency.value = 340; g.gain.value = 0.16; }
    src.connect(flt); flt.connect(g); g.connect(c.destination);
    src.start();
    if(kind === "deniz"){
      lfo = c.createOscillator(); lfo.frequency.value = 0.11;
      const lg = c.createGain(); lg.gain.value = 0.11;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
    }
    AMB = { src, g, lfo, kind };
    return true;
  }catch(e){ return false; }
}

/* ---------- 4a0. FORTSCHRITT SICHERN ----------
   Der Fortschritt liegt im Browser, also an einer Adresse
   auf einem Gerät. Mit diesem Code lässt er sich auf ein
   anderes Gerät oder nach einem gelöschten Browser
   zurückholen.                                            */
function makeCode(){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify({u:USERS, a:ACTIVE})))); }
  catch(e){ return ""; }
}
function readCode(txt){
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(txt.trim()))));
    if(!o || typeof o.u !== "object") return null;
    return o;
  }catch(e){ return null; }
}

function backupScreen(){
  const code = makeCode();
  app.innerHTML = topbar() + `

        <div class="err" id="e"></div>

      </div>
    </div>
    <div class="foot"><button class="cta ghost" id="back">Zurück</button></div>`;

  const g = id => document.getElementById(id);
  g("chip").onclick = profileSheet;
  g("back").onclick = home;
  g("copy").onclick = () => {
    const t = g("out");
    t.select(); t.setSelectionRange(0, 999999);

    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t.value).then(
          ()=>{ g("copy").textContent = "Kopiert"; },
          ()=>{ g("copy").textContent = "Bitte von Hand markieren und kopieren"; }
        );
        ok = true;
      }
    }catch(e){}
    if(!ok) g("copy").textContent = "Bitte von Hand markieren und kopieren";
  };
  g("load").onclick = () => {
    const o = readCode(g("in").value || "");
    if(!o){ g("e").textContent = "Der Code ist nicht lesbar."; return; }
    USERS = o.u;
    ACTIVE = (o.a && o.u[o.a]) ? o.a : null;
    S = ACTIVE ? Object.assign(fresh(), USERS[ACTIVE].data) : fresh();
    saveAll(); sfx("pass");
    if(ACTIVE) home(); else authScreen("login");
  };
}

/* ---------- 4b2. HÖRECKE ---------- */
let PL = { set:null, list:[], i:0, playing:false, step:0 }, plToken = 0;

function buildList(set){
  const out = [];
  BONUS.forEach((b,ui)=>{
    if(set === null || set === ui)
      b.cards.forEach((c,ci)=> out.push({ c, ui, ci, id: ui+"-"+ci }));
  });
  return out;
}

function hoerScreen(set){
  stopClip(); plToken++;
  PL = { set: (set === undefined ? PL.set : set), list: [], i:0, playing:false, step:0 };
  PL.list = buildList(PL.set);
  hoerRender();
}

function hoerRender(){
  const e = PL.list[PL.i];
  if(!e){ home(); return; }
  const c = e.c, on = S.saved.includes(e.id);
  const stepTxt = !PL.playing ? "Bereit" :
    (PL.step === 1 ? "Türkisch" : PL.step === 2 ? "Bedeutung" : "Wann man es sagt");

  app.innerHTML = topbar() + `
    <div class="hero" style="padding-bottom:12px">
      <h1>Hörecke</h1>
      <p>Zuhören statt tippen. Sprichwort, Bedeutung und wann man es sagt, eins nach dem anderen.</p>
    </div>
    ${canPlayAudio() ? "" : `<div class="warn">
      Auf diesem Gerät ist keine türkische Stimme installiert. Wir lesen türkische Sätze
      bewusst nicht mit einer deutschen Stimme vor, sonst würdest du dir eine falsche
      Aussprache angewöhnen. Lesen und Merken funktioniert weiterhin.</div>`}
    <div class="chips">
      <button class="${PL.set===null?"on":""}" data-set="all">Alle</button>
      ${BONUS.map((b,ui)=>`<button class="${PL.set===ui?"on":""}" data-set="${ui}">${esc(b.t)}</button>`).join("")}
    </div>
    <div class="player">
      <div class="pcard">
        <span class="btag">${esc(c.k)}</span>
        <p class="ptr">${esc(c.tr)}</p>
        <p class="pli">${esc(c.lit)}</p>
        <p class="pde">${esc(c.de)}</p>
        <div class="pus">${esc(c.use)}</div>
        <div class="now">${PL.playing ? "▶ "+stepTxt : "Pause"}</div>
      </div>
      <div class="controls">
        <button id="prev" ${PL.i===0?"disabled":""}>⏮</button>
        <button class="big" id="play" ${canPlayAudio()?"":"disabled"}>${PL.playing?"⏸":"▶"}</button>
        <button id="next" ${PL.i+1>=PL.list.length?"disabled":""}>⏭</button>
      </div>
      <div class="counter">${PL.i+1} / ${PL.list.length}</div>
      <button class="savebtn ${on?"on":""}" id="save">${on?"★ Gemerkt":"☆ Merken"}</button>
    </div>
    <div class="foot"><button class="cta ghost" id="back">Zurück zur Übersicht</button></div>`;

  const g = id => document.getElementById(id);
  g("chip").onclick = profileSheet;
  g("back").onclick = () => { stopClip(); plToken++; home(); };
  g("play").onclick = () => PL.playing ? plStop() : plPlay();
  g("prev").onclick = () => plGo(-1);
  g("next").onclick = () => plGo(1);
  g("save").onclick = () => {
    const i = S.saved.indexOf(e.id);
    if(i >= 0) S.saved.splice(i,1); else { S.saved.push(e.id); sfx("save"); }
    save(); hoerRender();
  };
  app.querySelectorAll("[data-set]").forEach(b=>{
    b.onclick = () => hoerScreen(b.dataset.set === "all" ? null : +b.dataset.set);
  });
}

function plGo(d){
  const n = PL.i + d;
  if(n < 0 || n >= PL.list.length) return;
  const wasPlaying = PL.playing;
  stopClip(); plToken++; PL.playing = false;
  PL.i = n; PL.step = 0;
  if(wasPlaying) plPlay(); else hoerRender();
}

function plStop(){
  plToken++; PL.playing = false; PL.step = 0; stopClip(); hoerRender();
}

function plPlay(){
  const my = ++plToken;
  PL.playing = true;
  stopClip();
  const e = PL.list[PL.i], c = e.c;
  const steps = [[c.tr,"tr",e.id], [c.de,"de",null], [c.use,"de",null]];
  let s = 0;
  const run = () => {
    if(my !== plToken || !PL.playing) return;
    if(s >= steps.length){
      if(PL.i + 1 < PL.list.length){
        PL.i++; PL.step = 0; hoerRender();
        setTimeout(()=>{ if(my === plToken && PL.playing) plPlay(); }, 500);
      } else { PL.playing = false; PL.step = 0; hoerRender(); }
      return;
    }
    const st = steps[s++];
    PL.step = s; hoerRender();
    playClip(st[2], st[0], st[1], () => setTimeout(run, 320));
  };
  run();
}

/* ---------- 4c. ABSCHLUSSTEST ---------- */
const EXAM_N = 8, EXAM_PASS = 6;

function startExam(ui){
  clearAdv();
  const pool = [];
  lessonsOf(ui).forEach(i=>{
    FLAT[i].items.forEach(it=>{ if(it.k !== "culture") pool.push(it); });
  });
  const picked = shuffle(pool).slice(0, Math.min(EXAM_N, pool.length));
  picked.forEach(it=>{ delete it._played; });
  L = { idx:-1, ui, exam:true, items:picked, pos:0, right:0, wrong:0,
        title:"Abschlusstest", state:"ask", picked:null, built:[], matched:[], msel:null, score:0 };
  render();
}

function boot(){
  /* Mit #alles am Ende der Adresse wird alles aufgeschlossen.
     Gedacht zum Durchsehen, nicht für normale Nutzer. */
  if((location.hash || "").toLowerCase() === "#alles"){
    if(!ACTIVE || !USERS[ACTIVE]){
      if(!USERS["__gast"]) USERS["__gast"] = {name:"Vorschau", pin:"", data:fresh()};
      ACTIVE = "__gast"; S = USERS[ACTIVE].data;
    }
    FLAT.forEach((_,i)=>{ if(!S.done.includes(i)) S.done.push(i); });
    UNITS.forEach((_,ui)=>{
      if(!S.bonusDone.includes(ui)) S.bonusDone.push(ui);
      if(!S.passed.includes(ui)) S.passed.push(ui);
    });
    S.pro = true;
    if(!S.xp) S.xp = 1500;
    save();
  }
  if(ACTIVE && USERS[ACTIVE]) home(); else authScreen("login");
}

/* ---------- 5. LEKTION ---------- */
let L = null;

function startLesson(idx){
  if(S.hearts <= 0){ noHearts(); return; }
  clearAdv();
  const les = FLAT[idx];
  les.items.forEach(it => { delete it._played; });
  L = { idx, items: les.items.slice(), pos:0, right:0, wrong:0, title:les.t, state:"ask", picked:null, built:[], matched:[], msel:null };
  render();
}

function noHearts(){
  app.innerHTML = topbar() + `<div class="result">
    <div class="emo">🥯</div>
    <h2>Simit alle</h2>
    <p>Jeder Fehler kostet ein Simit. Morgen liegen wieder fünf im Korb. Im Abschlusstest kostet dich ein Fehler übrigens keins.</p>
  </div>
  <div class="foot"><button class="cta red" id="back">Zur Übersicht</button></div>`;
  document.getElementById("back").onclick = home;
  document.getElementById("chip").onclick = profileSheet;
}

function render(){
  const it = L.items[L.pos];
  const pct = Math.round(L.pos / L.items.length * 100);
  let body = "", foot = "";

  /* ---- Aufgabe zeichnen ---- */
  if(it.k === "culture"){
    body = `<div class="q">
      <div class="q-kind">Typisch Türkisch</div>
      <div class="card">
        <p class="big">${esc(it.word)}</p>
        <p class="lit">${esc(it.lit)}</p>
        <p>${it.text}</p>
        <div class="tip">${it.tip}</div>
      </div>
      <button class="speak" id="sp" style="margin-top:14px">
        <span class="sp">🔊</span><span>${esc(it.word)}</span>
      </button>
    </div>`;
    foot = `<div class="foot"><button class="cta" id="next">Verstanden</button></div>`;
  }

  if(it.k === "choice"){
    const opts = it._opts || (it._opts = shuffle(it.opts));
    body = `<div class="q">
      <div class="q-kind">${esc(it.lbl || "Wähle die richtige Antwort")}</div>
      <h2 class="q-text">${esc(it.de)}</h2>
      <div class="opts">${opts.map((o,i)=>{
        let cls = "";
        if(L.state==="ask") cls = L.picked===i ? "sel" : "";
        else cls = (o===it.tr) ? "ok" : (L.picked===i ? "no" : "");
        return `<button class="opt ${cls}" data-opt="${i}">${esc(o)}</button>`;
      }).join("")}</div>
    </div>`;
  }

  if(it.k === "listen"){
    const opts = it._opts || (it._opts = shuffle(it.opts));
    body = `<div class="q">
      <div class="q-kind">Hören und verstehen</div>
      <h2 class="q-text">Was bedeutet das?</h2>
      <button class="speak" id="sp"><span class="sp">🔊</span><span>Antippen zum Hören</span></button>
      ${(!canSpeakTr() || L.state!=="ask")?`<p class="q-sub">${canSpeakTr()?"Gesagt wurde":"Ohne türkische Stimme auf diesem Gerät"}: <b>${esc(it.tr)}</b></p>`:""}
      <div class="opts">${opts.map((o,i)=>{
        let cls = "";
        if(L.state==="ask") cls = L.picked===i ? "sel" : "";
        else cls = (o===it.de) ? "ok" : (L.picked===i ? "no" : "");
        return `<button class="opt ${cls}" data-opt="${i}">${esc(o)}</button>`;
      }).join("")}</div>
    </div>`;
  }

  if(it.k === "build"){
    const bank = it._bank || (it._bank = shuffle(it.tiles));
    body = `<div class="q">
      <div class="q-kind">Satz bauen</div>
      <h2 class="q-text">${esc(it.de)}</h2>
      <div class="answerbox" id="ans">${L.built.map((t,i)=>`<button class="tile inans" data-rm="${i}">${esc(t)}</button>`).join("")}</div>
      <div class="bank">${bank.map((t,i)=>{
        const usedCount = L.built.filter(x=>x===t).length;
        const bankCount = bank.slice(0,i+1).filter(x=>x===t).length;
        const isUsed = usedCount >= bankCount;
        return `<button class="tile ${isUsed?"used":""}" data-add="${i}">${esc(t)}</button>`;
      }).join("")}</div>
    </div>`;
  }

  if(it.k === "match"){
    const left = it._l || (it._l = shuffle(it.pairs.map(p=>p[0])));
    const right = it._r || (it._r = shuffle(it.pairs.map(p=>p[1])));
    const cell = (v,side) => {
      const gone = L.matched.includes(v);
      const sel = L.msel && L.msel.v===v;
      return `<button class="mcell ${gone?"gone":""} ${sel?"sel":""}" data-m="${esc(v)}" data-side="${side}">${esc(v)}</button>`;
    };
    const rows = left.map((lv,i)=>cell(lv,"l") + cell(right[i],"r")).join("");
    body = `<div class="q">
      <div class="q-kind">Paare finden</div>
      <h2 class="q-text">Was gehört zusammen?</h2>
      <div class="matchgrid">${rows}</div>
    </div>`;
  }

  /* ---- Fußzeile ---- */
  if(it.k !== "culture" && it.k !== "match"){
    if(L.state === "ask"){
      const ready = it.k==="build" ? L.built.length===it.tiles.length : L.picked!==null;
      foot = `<div class="foot"><button class="cta" id="check" ${ready?"":"disabled"}>Prüfen</button></div>`;
    } else {
      const ok = L.state === "right";
      const correct = it.k==="build" ? it.ans : (it.k==="listen" ? it.de : it.tr);
      foot = `<div class="foot ${ok?"ok":"no"}">
        <div class="fb ${ok?"ok":"no"}">
          <span class="mark">${ok?"✓":"✕"}</span>
          <span><b>${ok?"Richtig":"Richtige Antwort: "+esc(correct)}</b>
          <span>${esc(it.why || (it.k==="listen" ? it.tr : (ok ? "" : it.tr||"")))}</span></span>
        </div>
        <button class="cta ${ok?"":"red"}" id="next">Weiter</button>
      </div>`;
    }
  }
  if(it.k === "match"){
    const allDone = L.matched.length === it.pairs.length*2;
    foot = `<div class="foot ${allDone?"ok":""}">
      ${allDone?`<div class="fb ok"><span class="mark">✓</span><span><b>Alle Paare gefunden</b></span></div>`:""}
      <button class="cta" id="next" ${allDone?"":"disabled"}>Weiter</button>
    </div>`;
  }

  app.innerHTML = `<div class="lessbar">
      <button class="x" id="quit">✕</button>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="stat heart"><span class="ic">🥯</span>${S.hearts}</div>
    </div>` + body + foot;

  wire(it);
}

let advTimer = null;
function clearAdv(){ if(advTimer){ clearTimeout(advTimer); advTimer = null; } }

function advance(){
  clearAdv();
  if(!L || !L.items) return;
  const it = L.items[L.pos];
  if(!it) return;
  if(L.exam){
    if(it.k === "match"){ if(!L.qWrong) L.score++; }
    else if(L.state === "right") L.score++;
  } else if(S.hearts <= 0){ noHearts(); return; }
  L.pos++; L.state="ask"; L.picked=null; L.built=[]; L.matched=[]; L.msel=null; L.qWrong=false;
  if(L.pos >= L.items.length) finish(); else render();
}

function wire(it){
  const q = id => document.getElementById(id);
  if(q("quit")) q("quit").onclick = () => { clearAdv(); home(); };
  if(q("sp")) q("sp").onclick = () => {
    say(it.k==="culture" ? it.word : it.tr);
    const rw = q("revealWrap");
    if(rw && L.state!=="ask") rw.innerHTML = "Gesagt wurde: <b>"+esc(it.tr)+"</b>";
  };

  // auto-play beim Hörverstehen
  if(it.k==="listen" && L.state==="ask" && !it._played){ it._played = true; setTimeout(()=>say(it.tr), 350); }

  app.querySelectorAll("[data-opt]").forEach(b=>{
    b.onclick = () => { if(L.state!=="ask") return; L.picked = +b.dataset.opt; render(); };
  });

  app.querySelectorAll("[data-add]").forEach(b=>{
    b.onclick = () => {
      if(L.state!=="ask") return;
      L.built.push(it._bank[+b.dataset.add]); render();
    };
  });
  app.querySelectorAll("[data-rm]").forEach(b=>{
    b.onclick = () => { if(L.state!=="ask") return; L.built.splice(+b.dataset.rm,1); render(); };
  });

  app.querySelectorAll("[data-m]").forEach(b=>{
    b.onclick = () => {
      const v = b.dataset.m, side = b.dataset.side;
      if(L.matched.includes(v)) return;
      if(!L.msel){ L.msel = {v,side}; render(); return; }
      if(L.msel.v === v){ L.msel = null; render(); return; }
      if(L.msel.side === side){ L.msel = {v,side}; render(); return; }
      const a = L.msel.side==="l" ? L.msel.v : v;
      const bb = L.msel.side==="l" ? v : L.msel.v;
      const hit = it.pairs.some(p=>p[0]===a && p[1]===bb);
      if(hit){ L.matched.push(a,bb); L.right++; sfx("right"); }
      else {
        L.wrong++; L.qWrong = true; sfx("wrong");
        if(!L.exam){ S.hearts = Math.max(0,S.hearts-1); save(); }
      }
      L.msel = null; render();
    };
  });

  if(q("check")) q("check").onclick = () => {
    let ok;
    if(it.k==="build") ok = L.built.join(" ") === it.ans;
    else if(it.k==="listen") ok = it._opts[L.picked] === it.de;
    else ok = it._opts[L.picked] === it.tr;
    if(ok){
      L.right++; L.state="right"; sfx("right");
      render();
      /* richtig: nach einer kurzen Pause von selbst weiter,
         kein zweiter Tipp nötig */
      advTimer = setTimeout(()=>{ advTimer = null; advance(); }, 900);
      return;
    }
    L.wrong++; L.qWrong = true; L.state="wrong"; sfx("wrong");
    if(!L.exam){ S.hearts = Math.max(0,S.hearts-1); save(); }
    render();
  };

  if(q("next")) q("next").onclick = advance;
}

/* ---------- 6. ERGEBNIS ---------- */
function finish(){
  if(L.exam) return examResult();
  const gained = L.right*10 + (L.wrong===0 ? 15 : 5);
  addXp(gained);
  if(!S.done.includes(L.idx)){ S.done.push(L.idx); save(); }
  const perfect = L.wrong===0;
  const total = L.right + L.wrong;
  const acc = total ? Math.round(L.right/total*100) : 100;

  app.innerHTML = `<div class="result">
    <div class="emo">${perfect?"🏆":"👏"}</div>
    <h2>${perfect ? (ACTIVE==="__gast" ? "Ohne Fehler" : "Ohne Fehler, "+esc(displayName())) : "Lektion geschafft"}</h2>
    <p>${esc(L.title)}</p>
    <div class="scores">
      <div class="score"><div class="in"><div class="k">Çay</div><div class="v">+${gained}</div></div></div>
      <div class="score b"><div class="in"><div class="k">Treffer</div><div class="v">${acc}%</div></div></div>
    </div>
  </div>
  <div class="foot">
    <button class="cta" id="cont">Weiter</button>
    ${FLAT[L.idx+1] ? `<button class="cta ghost" id="nextles">Direkt zur nächsten Lektion</button>` : ""}
  </div>`;
  document.getElementById("cont").onclick = home;
  const nl = document.getElementById("nextles");
  if(nl) nl.onclick = () => startLesson(L.idx+1);
  sfx("done"); voiceFb(V_DONE, 520);
}

function examResult(){
  const ui = L.ui, n = L.items.length;
  const need = Math.min(EXAM_PASS, Math.max(1, Math.ceil(n*0.75)));
  const ok = L.score >= need;
  const first = ok && !S.passed.includes(ui);
  if(first){ S.passed.push(ui); addXp(100); }
  else if(ok){ addXp(20); }
  save();
  sfx(ok ? "pass" : "fail");
  voiceFb(ok ? V_PASS : V_FAIL, 620);

  const nextUnit = UNITS[ui+1];
  app.innerHTML = `<div class="result">
    <div class="emo">${ok?"🎓":"📚"}</div>
    <h2>${ok ? (first ? "Test bestanden" : "Noch einmal bestanden") : "Noch nicht bestanden"}</h2>
    <p>${esc(UNITS[ui].t)}</p>
    <div class="scores">
      <div class="score"><div class="in"><div class="k">Richtig</div><div class="v">${L.score}/${n}</div></div></div>
      <div class="score b"><div class="in"><div class="k">Nötig</div><div class="v">${need}/${n}</div></div></div>
    </div>
    <p style="margin-top:20px">${ok
      ? (first && nextUnit ? "Einheit "+(ui+2)+" ist jetzt offen: "+esc(nextUnit.t) : "Du kannst jederzeit weiterüben.")
      : "Geh die Lektionen dieser Einheit noch einmal durch und versuch es dann erneut. Im Test kostet dich ein Fehler kein Simit."}</p>
  </div>
  <div class="foot">
    <button class="cta ${ok?"":"red"}" id="cont">${ok?"Weiter":"Zur Übersicht"}</button>
    ${ok?"":`<button class="cta ghost" id="again">Test noch einmal</button>`}
  </div>`;
  document.getElementById("cont").onclick = home;
  const ag = document.getElementById("again");
  if(ag) ag.onclick = () => startExam(ui);
}

boot();
/* Adresse ändert sich auf #alles, während die Seite offen ist:
   der Browser lädt dann nicht neu, also hier selbst reagieren. */
try{
  window.addEventListener("hashchange", () => {
    if((location.hash || "").toLowerCase() === "#alles") boot();
  });
}catch(e){}
</script>
